name: "Wheel Release"
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Set to true to only print files without making changes'
        required: false
        default: 'true'

jobs:
  Linux-Build-Wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyver: ["9", "10", "11", "12", "13"]

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Set up Python 3.${{ matrix.pyver }}
      uses: actions/setup-python@v5
      with:
        python-version: 3.${{ matrix.pyver }}

    - name: Build Wheel
      id: build-wheel
      run: |
        python -m build
        echo "ARTIFACT_NAME=$(readlink -f dist/*.whl)" >> $GITHUB_OUTPUT

    - name: Print Wheel Hash
      run: |
        sha256sum ${{ steps.build-wheel.outputs.ARTIFACT_NAME }} | awk '{print $1}' > sha256sum.txt
        cat sha256sum.txt

    - name: Upload Wheel To Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-ssrjson-benchmark-wheel-python3${{ matrix.pyver }}
        path: ${{ steps.build-wheel.outputs.ARTIFACT_NAME }}

  Windows-Build-Wheel:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pyver: ["9", "10", "11", "12", "13"]

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Set up Python 3.${{ matrix.pyver }}
      uses: actions/setup-python@v5
      with:
        python-version: 3.${{ matrix.pyver }}

    - name: Build Wheel
      run: |
        python -m build

    - name: Upload Wheel To Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-ssrjson-benchmark-wheel-python3${{ matrix.pyver }}
        path: dist/*.whl

  Publish:
    runs-on: ubuntu-latest
    needs:
      - Linux-Build-Wheel
      - Windows-Build-Wheel
    steps:
    - name: Checkout
      uses: actions/checkout@main
      with:
        token: '${{ secrets.ACTION_GITHUB_TOKEN }}'

    - name: Read dry-run input
      run: echo "DRY_RUN=${{ github.event.inputs['dry-run'] }}" >> $GITHUB_ENV

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: ./artifacts/
        pattern: "*ssrjson*"

    - name: Print all downloaded files
      run: |
        echo "All downloaded files:"
        find ./artifacts -type f

    - name: Read version from file
      id: get_version
      run: |
        VERSION=$(git describe --tags --abbrev=0)
        echo "Version is $VERSION"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Dry Run - Skip release steps
      if: env.DRY_RUN == 'true'
      run: echo "Dry run mode, skipping release and tag steps."

    - name: Import GPG key
      id: import-gpg
      uses: crazy-max/ghaction-import-gpg@master
      with:
        gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
        passphrase: ${{ secrets.PASSPHRASE }}
        git_user_signingkey: true
        git_commit_gpgsign: true

    - name: Install twine
      run: |
        python -m pip install twine

    - name: Publish to PyPI
      if: env.DRY_RUN != 'true'
      run: |
        twine upload ./artifacts/*
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}