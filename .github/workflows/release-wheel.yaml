name: "Wheel Release"
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Set to true to only print files without making changes'
        required: false
        default: true
        type: boolean 

jobs:
  Linux-Build-Wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pyver: ["9", "10", "11", "12", "13"]

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Set up Python 3.${{ matrix.pyver }}
      uses: actions/setup-python@v5
      with:
        python-version: 3.${{ matrix.pyver }}

    - name: Build Wheel
      id: build-wheel
      run: |
        python -m pip install build
        python -m build
        echo "ARTIFACT_NAME=$(readlink -f dist/*.whl)" >> $GITHUB_OUTPUT

    - name: Print Wheel Hash
      run: |
        sha256sum ${{ steps.build-wheel.outputs.ARTIFACT_NAME }} | awk '{print $1}' > sha256sum.txt
        cat sha256sum.txt

    - name: Upload Wheel To Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-ssrjson-benchmark-wheel-python3${{ matrix.pyver }}
        path: ${{ steps.build-wheel.outputs.ARTIFACT_NAME }}

  Windows-Build-Wheel:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pyver: ["9", "10", "11", "12", "13"]

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Set up Python 3.${{ matrix.pyver }}
      uses: actions/setup-python@v5
      with:
        python-version: 3.${{ matrix.pyver }}

    - name: Build Wheel
      run: |
        python -m pip install build
        python -m build

    - name: Upload Wheel To Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-ssrjson-benchmark-wheel-python3${{ matrix.pyver }}
        path: dist/*.whl

  Publish:
    runs-on: ubuntu-latest
    needs:
      - Linux-Build-Wheel
      - Windows-Build-Wheel
    permissions:
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: ./artifacts/
        pattern: "*ssrjson*"

    - name: Print all downloaded files
      run: |
        echo "All downloaded files:"
        find ./artifacts -type f

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      if: ${{ !github.event.inputs['dry-run'] }}
      with:
        packages-dir: ./artifacts/
        print-hash: true
